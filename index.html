<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDG On Campus AASTMT Aswan | Frame Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --blue:#4285f4; --red:#ea4335; --yellow:#fbbc04; --green:#34a853; --ink:#202124; --muted:#5f6368; --line:#dadce0; --bg:#f8f9fa; --primary:#1a73e8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Google Sans','Roboto',system-ui,sans-serif; }
  .bar { height:6px; background:linear-gradient(90deg,var(--blue) 0 25%,var(--red) 25% 50%,var(--yellow) 50% 75%,var(--green) 75% 100%); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:12px; }
  .logo { display:flex; gap:4px; }
  .logo i { width:10px; height:10px; border-radius:50%; display:block; }
  header b { font-size:1.05rem; font-weight:500; }
  header span { color:var(--muted); font-size:.95rem; }
  .wrap { max-width:1040px; margin:0 auto; padding:24px 16px 40px; display:grid; gap:24px; grid-template-columns:340px 1fr; align-items:start; }
  @media (max-width:820px){ .wrap { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:24px; padding:24px; }
  h1 { font-size:1.6rem; font-weight:500; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 8px; }
  label { display:block; margin:18px 0 6px; font-weight:500; font-size:.9rem; color:var(--muted); }
  input[type=text], select { width:100%; padding:13px 14px; border-radius:12px; border:1px solid #80868b; background:#fff; color:var(--ink); font:inherit; }
  input[type=text]:focus, select:focus { outline:2px solid var(--primary); border-color:var(--primary); }
  input[type=range] { width:100%; accent-color:var(--primary); }
  .file { display:flex; align-items:center; gap:10px; }
  .file input { display:none; }
  .file span { color:var(--muted); font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button, .btn { flex:1; min-width:120px; padding:12px 18px; border-radius:999px; font:inherit; font-weight:500; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--primary); text-align:center; }
  button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  button:hover, .btn:hover { filter:brightness(.96); }
  button:focus-visible, .btn:focus-within { outline:3px solid var(--yellow); outline-offset:2px; }
  .btn { flex:0 0 auto; min-width:0; }
  canvas { width:100%; max-width:560px; margin:0 auto; height:auto; border-radius:16px; display:block; border:1px solid var(--line); }
  .hint { color:var(--muted); font-size:.85rem; margin-top:14px; }
</style>
</head>
<body>
<div class="bar"></div>
<header>
  <div class="logo"><i style="background:#4285f4"></i><i style="background:#ea4335"></i><i style="background:#fbbc04"></i><i style="background:#34a853"></i></div>
  <b>Google Developer Groups</b><span>On Campus, AASTMT Aswan</span>
</header>

<div class="wrap">
  <div class="card">
    <h1>Create your frame</h1>
    <p class="sub">Enter your name, pick your track, and add your photo.</p>

    <label for="name">Full name</label>
    <input type="text" id="name" maxlength="30" placeholder="Your name" autocomplete="name">

    <label for="track">Track</label>
    <select id="track"></select>

    <label>Your photo</label>
    <div class="file">
      <label class="btn" style="margin:0;color:var(--primary);font-weight:500;font-size:1rem">
        Choose photo
        <input type="file" id="photo" accept="image/*">
      </label>
      <span id="fname">No file selected</span>
    </div>

    <label for="pos">Move photo up / down</label>
    <input type="range" id="pos" min="0" max="100" value="30">

    <div class="row">
      <button id="download" class="primary">Download</button>
      <button id="share">Share</button>
    </div>
    <div class="row">
      <button id="copycap">Copy caption</button>
    </div>
    <p class="hint">Your photo is processed on your device and is never uploaded.</p>
  </div>

  <div class="card">
    <canvas id="c" width="1138" height="1280"></canvas>
  </div>
</div>

<script>
/* =========== EDIT HERE ONLY =========== */
const CONFIG = {
  frameSrc:  "frame.png",
  hashtag:   "#GDG_AASTMT_Aswan",
  eventName: "GDG On Campus AASTMT Aswan",
  // photo area inside the frame (pixels, frame is 1138x1280)
  photoBox: { x: 328, y: 166, w: 481, h: 480, radius: 22 },
  // name goes under the photo, track goes inside the pill under "I'M ATTENDING IN"
  nameY: 722,
  trackBox: { cx: 569, cy: 888, maxW: 520 },
  tracks: [
    { name: "AI",                   color: "#1a73e8", text: "#ffffff" },
    { name: "Cyber Security",       color: "#d93025", text: "#ffffff" },
    { name: "Web Development",      color: "#188038", text: "#ffffff" },
    { name: "Mobile App",           color: "#e37400", text: "#ffffff" },
    { name: "Software Engineering", color: "#202124", text: "#ffffff" },
    { name: "Data Science",         color: "#129eaf", text: "#ffffff" }
  ],
  nameColor: "#14284b"
};
/* ====================================== */

const FONT = "'Roboto','Cairo',sans-serif";
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
let userImg = null, frameImg = null;

CONFIG.tracks.forEach((t, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = t.name; $('track').appendChild(o);
});

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitText(text, x, y, maxW, size, weight, color) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  while (ctx.measureText(text).width > maxW && size > 18) {
    size -= 2; ctx.font = `${weight} ${size}px ${FONT}`;
  }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function draw() {
  const b = CONFIG.photoBox, tb = CONFIG.trackBox;
  const track = CONFIG.tracks[$('track').value];
  const name = $('name').value.trim() || "Your name";

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (frameImg) ctx.drawImage(frameImg, 0, 0, W, H);

  // photo
  ctx.save();
  rr(b.x, b.y, b.w, b.h, b.radius); ctx.clip();
  if (userImg) {
    const s = Math.max(b.w / userImg.width, b.h / userImg.height);
    const dw = userImg.width * s, dh = userImg.height * s;
    const dx = b.x - (dw - b.w) / 2;
    const dy = b.y - (dh - b.h) * ($('pos').value / 100);
    ctx.drawImage(userImg, dx, dy, dw, dh);
  } else {
    ctx.fillStyle = '#e8f0fe'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitText('Upload your photo', b.x + b.w / 2, b.y + b.h / 2, b.w * 0.8, 40, 500, '#5f6368');
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // name under the photo
  fitText(name, b.x + b.w / 2, CONFIG.nameY, 700, 56, 700, CONFIG.nameColor);
  // track inside the pill
  ctx.textBaseline = 'middle';
  fitText(track.name, tb.cx, tb.cy + 2, tb.maxW, 40, 700, track.color);
  ctx.textBaseline = 'alphabetic';
}

['name', 'track', 'pos'].forEach(id => $(id).addEventListener('input', draw));
$('photo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  $('fname').textContent = f.name;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    // downscale big phone photos so the page stays fast and light on memory
    const MAX = 1600, k = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    userImg = c;
    URL.revokeObjectURL(url);
    draw();
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('Could not read this image. Please try another photo.'); };
  img.src = url;
});

function toBlob() { return new Promise(r => canvas.toBlob(r, 'image/png')); }
function caption() {
  const t = CONFIG.tracks[$('track').value].name;
  return `I'm joining the ${t} track at ${CONFIG.eventName} 🚀\n${CONFIG.hashtag}`;
}

$('download').addEventListener('click', async () => {
  const b = await toBlob();
  const a = document.createElement('a');
  const u = URL.createObjectURL(b);
  a.href = u;
  a.download = 'my-gdg-frame.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
});
$('share').addEventListener('click', async () => {
  const b = await toBlob();
  const file = new File([b], 'my-gdg-frame.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text: caption() }); } catch (e) {}
  } else { alert('Sharing is not supported on this device. Please use Download.'); }
});
$('copycap').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(caption()); $('copycap').textContent = 'Copied ✓'; }
  catch (e) { prompt('Copy your caption:', caption()); }
});

(async function init() {
  try { await Promise.all([document.fonts.load('700 40px Roboto'), document.fonts.load('500 40px Roboto'), document.fonts.load('700 40px Cairo')]); } catch (e) {}
  frameImg = new Image();
  frameImg.onload = draw;
  frameImg.onerror = () => { frameImg = null; draw(); };
  frameImg.src = CONFIG.frameSrc;
  draw();
})();
</script>
</body>
</html>
